# Multi-GPU deployment: 2 workers (one per 3090) + Nginx load balancer
services:
  worker-0:
    build: .
    container_name: anime-worker-0
    environment:
      # device_ids below pins this container to physical GPU 0; inside the
      # container that GPU is renumbered to cuda:0, so GPU_ID must stay 0.
      - GPU_ID=0
      - EAGER_LOAD=1
      - SD_BASE_MODEL=runwayml/stable-diffusion-v1-5
      - CONTROLNET_MODEL=lllyasviel/control_v11f1p_sd15_depth
      - LORA_PATH=
      - LORA_SCALE=0.8
    volumes:
      - model-cache:/app/models
    ports:
      - "8001:8000"   # Direct access for debugging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

  worker-1:
    build: .
    container_name: anime-worker-1
    environment:
      # device_ids below pins this container to physical GPU 1; inside the
      # container that GPU is renumbered to cuda:0, so GPU_ID must stay 0.
      - GPU_ID=0
      - EAGER_LOAD=1
      - SD_BASE_MODEL=runwayml/stable-diffusion-v1-5
      - CONTROLNET_MODEL=lllyasviel/control_v11f1p_sd15_depth
      - LORA_PATH=
      - LORA_SCALE=0.8
    volumes:
      - model-cache:/app/models
    ports:
      - "8002:8000"   # Direct access for debugging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: anime-lb
    ports:
      - "8200:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - worker-0
      - worker-1
    restart: unless-stopped

volumes:
  model-cache:
