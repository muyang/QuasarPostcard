events {
    worker_connections 1024;
}

http {
    upstream anime_workers {
        # Round-robin load balancing across 2 GPU workers
        server worker-0:8000 weight=1;
        server worker-1:8000 weight=1;
        keepalive 32;
    }

    server {
        listen 80;
        client_max_body_size 20m;  # base64 images can be large

        # API endpoint
        location /api/ {
            proxy_pass http://anime_workers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;   # SD inference can take up to 2 min
            proxy_send_timeout 60s;
        }

        # Health check
        location /health {
            proxy_pass http://anime_workers/health;
        }

        # Load balancer status
        location /lb_status {
            stub_status on;
        }
    }
}
