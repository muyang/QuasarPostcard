server {
    listen 80;
    server_name card.qpvisiontech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name card.qpvisiontech.com;

    ssl_certificate     /etc/letsencrypt/live/card.qpvisiontech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/card.qpvisiontech.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    # Proxy to FastAPI
    location / {
        proxy_pass http://postcard:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Static files cache
    location /static/ {
        proxy_pass http://postcard:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
